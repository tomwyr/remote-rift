name: remote_rift
description: Remote Rift lets you queue for League of Legends games from your phone.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/mobile
  - apps/desktop
  - apps/league_client_simulator
  - packages/api
  - packages/core
  - packages/logging
  - packages/mcp
  - packages/ui
  - packages/utils
  - packages/updater
