name: Publish mobile to app stores

on:
  workflow_call:
    # Each store job handles missing credentials independently.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      IOS_CERTIFICATE_P12_BASE64:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish-play:
    name: Build and upload Android bundle and symbols
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Prepare signed Android build
        uses: ./.github/actions/prepare-android-build
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed Android App Bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Package native debug symbols
        working-directory: apps/mobile/build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
        run: zip -q "$RUNNER_TEMP/native-debug-symbols.zip" */*.so

      - name: Upload bundle and native symbols to Google Play beta
        working-directory: apps/mobile
        env:
          ANDROID_APPLICATION_ID: ${{ vars.MOBILE_APPLICATION_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: fastlane android deploy

  publish-testflight:
    name: Build and upload signed iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare signed iOS build
        uses: ./.github/actions/prepare-ios-build
        with:
          team-id: ${{ vars.IOS_TEAM_ID }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build signed IPA
        working-directory: apps/mobile
        run: flutter build ipa --release --export-options-plist="${RUNNER_TEMP:?}/ios-signing/ExportOptions.plist"

      - name: Upload signed IPA to TestFlight
        working-directory: apps/mobile
        env:
          IOS_BUNDLE_ID: ${{ vars.MOBILE_APPLICATION_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: fastlane ios deploy
