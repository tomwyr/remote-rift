name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Pub executables to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Install dependencies
        run: dart pub get

      - name: List workspace packages
        run: dart pub workspace list

      - name: Analyze workspace
        run: dart analyze

      - name: Test utils package
        working-directory: packages/utils
        run: dart test

      - name: Test application updater package
        working-directory: packages/application_updater
        run: dart test

      - name: Build connector executable
        run: dart compile exe packages/connector/lib/src/cli/main.dart -o /tmp/remoterift

      - name: Build website
        working-directory: apps/website
        run: jaspr build --dart-define=BASE_PATH=/remote-rift/
