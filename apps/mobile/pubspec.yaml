name: remote_rift_mobile
description: Mobile application allowing remote interaction with the League client.
version: 0.9.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  cancelable_stream: ^1.0.0
  draft: ^0.0.12
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  http: ^1.5.0
  json_annotation: ^4.9.0
  slang: ^4.8.1
  slang_flutter: ^4.8.0
  vibration: ^3.1.5
  web_socket_channel: ^3.0.3
  equatable: ^2.0.8

  remote_rift_core: any
  remote_rift_ui: any
  remote_rift_utils: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0
  build_runner: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
