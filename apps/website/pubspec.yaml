name: remote_rift_website
description: Landing page showcasing the application and guiding users on getting started.
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  jaspr: ^0.23.2
  jaspr_router: ^0.8.2
  universal_web: ^1.1.1

dev_dependencies:
  # Must match jaspr_cli's daemon version so both use the same metadata protocol.
  build_daemon: 4.1.2
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.2
  lints: ^6.0.0

jaspr:
  mode: static
